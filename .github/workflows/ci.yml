name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Vet & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pauza_test
          POSTGRES_PASSWORD: pauza_test_password
          POSTGRES_DB: pauza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pauza_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://pauza_test:pauza_test_password@localhost:5432/pauza_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -tags=integration -race -count=1 ./...
