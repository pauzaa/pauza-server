          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Page size. Invalid, non-positive, or values above 100 fall back to 20.
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: Optional search filter (matches email, name, or username).
      responses:
        "200":
          description: Paginated user list.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
