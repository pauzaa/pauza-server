        Receives subscription lifecycle events from RevenueCat. Authenticated via a
        static Bearer secret (not a user JWT). Rate limited by IP using the
        `webhook` tier. Returns 200 on success; 500 on transient failures so
        RevenueCat retries delivery.
      security:
        - WebhookBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueCatWebhookPayload"
      responses:
        "200":
          description: Webhook processed successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

