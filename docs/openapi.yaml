      tags: [Admin]
      summary: List users (admin)
      description: Requires an admin JWT. Rate limited by admin user ID using the `admin` tier. Invalid `page` and `limit` values silently fall back to defaults.
      security:
        - AdminJWT: []
      parameters:
        - name: page
