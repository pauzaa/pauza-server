openapi: 3.0.3
info:
  title: Pauza API
  description: Backend HTTP API for the Pauza focus-timer application.
  version: 0.1.0
  contact:
    name: Pauza Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.pauza.app
    description: Production (placeholder)

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Passwordless authentication (start, verify, refresh)
  - name: Profile
    description: Current user profile management
  - name: Social
    description: Devices, friends, search, and leaderboards
  - name: Sync
    description: Bidirectional data synchronisation
  - name: Webhook
    description: RevenueCat subscription webhooks
  - name: Admin
    description: Admin dashboard endpoints

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    UserJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token issued by POST /api/v1/auth/verify or POST /api/v1/auth/refresh.
    AdminJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin access token issued by POST /api/v1/admin/login.
    WebhookBearer:
      type: http
      scheme: bearer
      description: Static secret shared with RevenueCat for webhook authentication.

  headers:
    XRequestId:
      description: Request identifier echoed in every response.
      schema:
        type: string
    XRateLimitLimit:
      description: Maximum requests allowed in the current window when the limiter is enforcing a real budget.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Remaining requests in the current window when the limiter is enforcing a real budget.
      schema:
        type: integer
    XRateLimitReset:
      description: UTC Unix timestamp when the current window resets, when the limiter is enforcing a real budget.
      schema:
        type: integer

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:
    # -- Error envelope -----------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - RATE_LIMITED
            - SUBSCRIPTION_REQUIRED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          description: Optional structured details (e.g. field-level validation errors).
          nullable: true

    ValidationDetails:
      type: object
      properties:
        fields:
          type: object
          additionalProperties:
            type: string

    # -- Health -------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        timestamp:
          type: string
          format: date-time

    LiveHealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time

    ReadyHealthOKResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time

    ReadyHealthDegradedResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [degraded]
        timestamp:
          type: string
          format: date-time

    # -- Auth ---------------------------------------------------------------
    StartRequest:
      type: object
      additionalProperties: false
      required: [email]
      description: Unknown JSON fields are rejected. Only a bare email address is accepted.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Bare address only (`user@example.com`); display-name forms are rejected.

    StartResponse:
      type: object
      required: [otp_required]
      properties:
        otp_required:
          type: boolean

    VerifyOTPRequest:
      type: object
      additionalProperties: false
      required: [email, otp]
      description: Unknown JSON fields are rejected.
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Bare address only (`user@example.com`); display-name forms are rejected.
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: Exactly 6 ASCII digits.

    AuthResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      description: Unknown JSON fields are rejected.
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Must be present and not blank after trimming whitespace.

    RefreshResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    # -- User profile -------------------------------------------------------
    UserResponse:
      type: object
      required: [id, email, name, username, profile_picture_url, push_enabled, leaderboard_visible, created_at, subscription]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        username:
          type: string
        profile_picture_url:
          type: string
          nullable: true
        push_enabled:
          type: boolean
        leaderboard_visible:
          type: boolean
        created_at:
          type: string
          format: date-time
        subscription:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SubscriptionResponse"

    SubscriptionResponse:
      type: object
      required: [entitlement, is_active, current_period_end]
      properties:
        entitlement:
          type: string
        is_active:
          type: boolean
        current_period_end:
          type: string
          format: date-time
          nullable: true

    UpdateMeRequest:
      type: object
      additionalProperties: false
      description: Unknown JSON fields are rejected. All fields are optional.
      properties:
        name:
          type: string
          maxLength: 100
        username:
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
          description: 3-30 characters; letters, digits, and underscores only.
    PrivacyPreferencesResponse:
      type: object
      required: [leaderboard_visible]
      properties:
        leaderboard_visible:
          type: boolean

    UpdatePrivacyPreferencesRequest:
      type: object
      additionalProperties: false
      description: Unknown JSON fields are rejected. All fields are optional.
      properties:
        leaderboard_visible:
          type: boolean

    NotificationPreferencesResponse:
      type: object
      required: [push_enabled]
      properties:
        push_enabled:
          type: boolean

    UpdateNotificationPreferencesRequest:
      type: object
      additionalProperties: false
      description: Unknown JSON fields are rejected. All fields are optional.
      properties:
        push_enabled:
          type: boolean

    UsernameAvailableResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean

    PhotoUploadResponse:
      type: object
      required: [profile_picture_url]
      properties:
        profile_picture_url:
          type: string
          description: Public URL served by the deployment's reverse proxy from machine-local photo storage.

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    DeleteConfirmRequest:
      type: object
      additionalProperties: false
      required: [otp]
      description: Unknown JSON fields are rejected.
      properties:
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: Exactly 6 ASCII digits.

    # -- Devices ------------------------------------------------------------
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [fcm_token, platform]
      description: Unknown JSON fields are rejected.
      properties:
        fcm_token:
          type: string
          minLength: 1
        platform:
          type: string
          enum: [android, ios]

    UnregisterDeviceRequest:
      type: object
      additionalProperties: false
      required: [fcm_token]
      description: Unknown JSON fields are rejected.
      properties:
        fcm_token:
          type: string
          minLength: 1

    # -- Friends ------------------------------------------------------------
    FriendRequestRequest:
      type: object
      additionalProperties: false
      required: [username]
      description: Unknown JSON fields are rejected.
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9_]{3,30}$'
          description: 3-30 characters; letters, digits, and underscores only.

    # BasicUserRow has no json tags; Go encoding/json uses PascalCase field names.
    BasicUserRow:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        Name:
          type: string
        Username:
          type: string
        ProfilePictureURL:
          type: string
          nullable: true
        LeaderboardVisible:
          type: boolean

    # FriendRow has no json tags.
    FriendRow:
      type: object
      properties:
        FriendshipID:
          type: string
          format: uuid
        User:
          $ref: "#/components/schemas/BasicUserRow"
        Since:
          type: string
          format: date-time

    # FriendRequestRow has no json tags.
    FriendRequestRow:
      type: object
      properties:
        FriendshipID:
          type: string
          format: uuid
        User:
          $ref: "#/components/schemas/BasicUserRow"
        CreatedAt:
          type: string
          format: date-time

    # PaginationResult has no json tags.
    PaginationResult:
      type: object
      properties:
        Page:
          type: integer
        Limit:
          type: integer
        Total:
          type: integer

    # FriendMutationOutput has no json tags.
    FriendMutationOutput:
      type: object
      properties:
        FriendshipID:
          type: string
          format: uuid
        Status:
          type: string
          enum: [pending, accepted]

    # FriendListOutput has no json tags; serialised directly via writeJSON.
    FriendListOutput:
      type: object
      properties:
        Friends:
          type: array
          items:
            $ref: "#/components/schemas/FriendRow"
          nullable: true
        Pagination:
          $ref: "#/components/schemas/PaginationResult"

    FriendRequestsOutput:
      type: object
      properties:
        Requests:
          type: array
          items:
            $ref: "#/components/schemas/FriendRequestRow"
          nullable: true

    SearchUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/BasicUserRow"
          nullable: true

    # -- Friend stats -------------------------------------------------------
    DailyTrend:
      type: object
      required: [local_day, effective_ms, qualified, session_count]
      properties:
        local_day:
          type: string
          example: "2025-01-15"
        effective_ms:
          type: integer
        qualified:
          type: boolean
        session_count:
          type: integer

    FriendStatsResponse:
      type: object
      properties:
        User:
          $ref: "#/components/schemas/BasicUserRow"
        Stats:
          type: object
          required: [current_streak_days, longest_streak_days, total_focus_time_ms, daily_trends]
          properties:
            current_streak_days:
              type: integer
            longest_streak_days:
              type: integer
            total_focus_time_ms:
              type: integer
              format: int64
            daily_trends:
              type: array
              items:
                $ref: "#/components/schemas/DailyTrend"
              nullable: true

    # -- Leaderboard --------------------------------------------------------
    LeaderboardEntry:
      type: object
      required: [rank, user]
      properties:
        rank:
          type: integer
        user:
          $ref: "#/components/schemas/BasicUserRow"
        current_streak_days:
          type: integer
        total_focus_time_ms:
          type: integer
          format: int64

    LeaderboardRank:
      type: object
      required: [rank]
      properties:
        rank:
          type: integer
        current_streak_days:
          type: integer
        total_focus_time_ms:
          type: integer
          format: int64

    LeaderboardResponse:
      type: object
      required: [entries, my_rank, pagination]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
          nullable: true
        my_rank:
          $ref: "#/components/schemas/LeaderboardRank"
        pagination:
          $ref: "#/components/schemas/PaginationResult"

    # -- Sync ---------------------------------------------------------------
    SyncRequest:
      type: object
      additionalProperties: false
      description: Unknown JSON fields are rejected. `tables` is optional; omitted or empty means no table syncs are requested.
      properties:
        tables:
          $ref: "#/components/schemas/SyncRequestTables"

    SyncRequestTables:
      type: object
      additionalProperties: false
      description: Each table key is optional. When present, it triggers sync for that table. Unknown keys are rejected.
      properties:
        modes:
          $ref: "#/components/schemas/SyncTableInput_Mode_string"
        mode_blocked_apps:
          $ref: "#/components/schemas/SyncTableInput_ModeBlockedApp_ModeBlockedAppDeletion"
        schedules:
          $ref: "#/components/schemas/SyncTableInput_Schedule_string"
        restriction_sessions:
          $ref: "#/components/schemas/SyncTableInput_RestrictionSession_string"
        restriction_lifecycle_events:
          $ref: "#/components/schemas/SyncTableInput_RestrictionLifecycleEvent_string"
        nfc_linked_chips:
          $ref: "#/components/schemas/SyncTableInput_NFCLinkedChip_string"
        qr_linked_codes:
          $ref: "#/components/schemas/SyncTableInput_QRLinkedCode_string"
        streak_session_daily_rollups:
          $ref: "#/components/schemas/SyncTableInput_StreakSessionDailyRollup_StreakSessionDailyRollupDeletion"
        streak_daily_aggregates:
          $ref: "#/components/schemas/SyncTableInput_StreakDailyAggregate_string"

    # Generic sync-table input wrappers (OpenAPI 3.0 cannot use generics)
    SyncTableInput_Mode_string:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/ModeInput"
        deletions:
          type: array
          items:
            type: string

    SyncTableInput_ModeBlockedApp_ModeBlockedAppDeletion:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/ModeBlockedAppInput"
        deletions:
          type: array
          items:
            $ref: "#/components/schemas/ModeBlockedAppDeletion"

    SyncTableInput_Schedule_string:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleInput"
        deletions:
          type: array
          items:
            type: string

    SyncTableInput_RestrictionSession_string:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/RestrictionSessionInput"
        deletions:
          type: array
          items:
            type: string

    SyncTableInput_RestrictionLifecycleEvent_string:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/RestrictionLifecycleEventInput"
        deletions:
          type: array
          items:
            type: string

    SyncTableInput_NFCLinkedChip_string:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/NFCLinkedChipInput"
        deletions:
          type: array
          items:
            type: string

    SyncTableInput_QRLinkedCode_string:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/QRLinkedCodeInput"
        deletions:
          type: array
          items:
            type: string

    SyncTableInput_StreakSessionDailyRollup_StreakSessionDailyRollupDeletion:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/StreakSessionDailyRollupInput"
        deletions:
          type: array
          items:
            $ref: "#/components/schemas/StreakSessionDailyRollupDeletion"

    SyncTableInput_StreakDailyAggregate_string:
      type: object
      required: [last_synced_at]
      additionalProperties: false
      properties:
        last_synced_at:
          type: integer
          format: int64
          minimum: 0
          description: Required when the table object is present.
        upserts:
          type: array
          items:
            $ref: "#/components/schemas/StreakDailyAggregateInput"
        deletions:
          type: array
          items:
            type: string

    # Sync upsert/row models (json tags from handler and syncmodel)
    ModeInput:
      type: object
      additionalProperties: false
      required: [id, title, text_on_screen, ending_pausing_scenario, icon_token, allowed_pauses_count, created_at, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        text_on_screen:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        allowed_pauses_count:
          type: integer
          minimum: 0
        minimum_duration_ms:
          type: integer
          minimum: 1000
          nullable: true
        ending_pausing_scenario:
          type: string
          enum: [nfc, qr, manual]
        icon_token:
          type: string
          minLength: 1
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    ModeBlockedAppInput:
      type: object
      additionalProperties: false
      required: [mode_id, platform, app_identifier, created_at, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        mode_id:
          type: string
          minLength: 1
        platform:
          type: string
          enum: [android, ios]
        app_identifier:
          type: string
          minLength: 1
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    ModeBlockedAppDeletion:
      type: object
      additionalProperties: false
      required: [mode_id, platform, app_identifier]
      description: Unknown JSON fields are rejected.
      properties:
        mode_id:
          type: string
          minLength: 1
        platform:
          type: string
          enum: [android, ios]
        app_identifier:
          type: string
          minLength: 1

    ScheduleInput:
      type: object
      additionalProperties: false
      required: [id, mode_id, days, start_minute, end_minute, enabled, created_at, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        id:
          type: string
          minLength: 1
        mode_id:
          type: string
          minLength: 1
        days:
          type: string
          minLength: 1
        start_minute:
          type: integer
          minimum: 0
          maximum: 1439
        end_minute:
          type: integer
          minimum: 0
          maximum: 1439
        enabled:
          type: integer
          enum: [0, 1]
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    RestrictionSessionInput:
      type: object
      additionalProperties: false
      required: [session_id, mode_id, source, started_at, pause_count, total_paused_ms, integrity_status, last_event_id, created_at, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        session_id:
          type: string
          minLength: 1
        mode_id:
          type: string
          minLength: 1
        source:
          type: string
          enum: [manual, schedule]
        started_at:
          type: integer
          format: int64
        ended_at:
          type: integer
          format: int64
          nullable: true
        pause_count:
          type: integer
        total_paused_ms:
          type: integer
        last_paused_at:
          type: integer
          format: int64
          nullable: true
        integrity_status:
          type: string
          enum: [ok, anomaly]
        last_anomaly_reason:
          type: string
          nullable: true
        last_event_id:
          type: string
          minLength: 1
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    RestrictionLifecycleEventInput:
      type: object
      additionalProperties: false
      required: [id, session_id, mode_id, action, source, reason, occurred_at, created_at]
      description: Unknown JSON fields are rejected.
      properties:
        id:
          type: string
          minLength: 1
        session_id:
          type: string
          minLength: 1
        mode_id:
          type: string
          minLength: 1
        action:
          type: string
          enum: [START, PAUSE, RESUME, END]
        source:
          type: string
          enum: [manual, schedule]
        reason:
          type: string
          minLength: 1
        occurred_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64

    NFCLinkedChipInput:
      type: object
      additionalProperties: false
      required: [id, chip_identifier, name, created_at, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        id:
          type: string
          minLength: 1
        chip_identifier:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    QRLinkedCodeInput:
      type: object
      additionalProperties: false
      required: [id, scan_value, name, created_at, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        id:
          type: string
          minLength: 1
        scan_value:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    StreakSessionDailyRollupInput:
      type: object
      additionalProperties: false
      required: [session_id, local_day, effective_ms, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        session_id:
          type: string
          minLength: 1
        local_day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        effective_ms:
          type: integer
          minimum: 0
        updated_at:
          type: integer
          format: int64

    StreakSessionDailyRollupDeletion:
      type: object
      additionalProperties: false
      required: [session_id, local_day]
      description: Unknown JSON fields are rejected.
      properties:
        session_id:
          type: string
          minLength: 1
        local_day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'

    StreakDailyAggregateInput:
      type: object
      additionalProperties: false
      required: [local_day, effective_ms, qualified, source_session_count, updated_at]
      description: Unknown JSON fields are rejected.
      properties:
        local_day:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        effective_ms:
          type: integer
          minimum: 0
        qualified:
          type: integer
          enum: [0, 1]
        source_session_count:
          type: integer
          minimum: 0
        updated_at:
          type: integer
          format: int64

    # Sync response models (json tags from syncmodel/types.go)
    SyncResponse:
      type: object
      required: [server_time, tables]
      properties:
        server_time:
          type: integer
          format: int64
          description: Server wall-clock in Unix milliseconds.
        tables:
          $ref: "#/components/schemas/SyncResponseTables"

    SyncResponseTables:
      type: object
      description: Only tables requested in the input are present in the response.
      properties:
        modes:
          $ref: "#/components/schemas/SyncTableChanges_Mode_string"
