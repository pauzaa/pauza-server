      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # =========================================================================
  # Health
  # =========================================================================
  /live:
    get:
      operationId: getLive
      tags: [Health]
      summary: Liveness probe
      description: Always returns 200 to indicate the process is running. No external dependencies are checked.
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealthResponse"

  /ready:
    get:
      operationId: getReady
      tags: [Health]
      summary: Readiness probe
      description: Pings the database. Returns 200 when healthy, 503 when degraded.
      responses:
        "200":
          description: Service is ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealthOKResponse"
        "503":
          description: Service is degraded (database unreachable).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealthDegradedResponse"

  # =========================================================================
  # Static files
  # =========================================================================
  /photos/{filepath}:
    get:
      operationId: getPhoto
      tags: [Static]
      summary: Serve a profile photo
      description: >
        Serves static profile photo files from the configured `PHOTO_STORAGE_DIR`
        on disk. The `filepath` segment corresponds to the filename portion of
        `profile_picture_url` values returned by other endpoints. No authentication
        required; files are publicly accessible via the reverse proxy.
      parameters:
        - name: filepath
          in: path
          required: true
          description: Filename (and optional sub-path) of the photo to serve.
          schema:
            type: string
      responses:
        "200":
          description: Photo file returned with appropriate Content-Type.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: File not found.

  # =========================================================================
  # Auth
  # =========================================================================
  /api/v1/auth/start:
    post:
      operationId: authStart
      tags: [Auth]
      summary: Start passwordless login
      description: Sends a one-time password to the provided email address. The response always indicates otp_required to avoid leaking account existence. Unknown JSON fields are rejected. Rate limited by IP using the `auth` tier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          description: OTP sent (or silently accepted for anti-enumeration).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/verify:
    post:
      operationId: authVerify
      tags: [Auth]
      summary: Verify OTP and sign in
      description: "Validates the OTP, creates a user if needed, and returns access + refresh tokens. Unknown JSON fields are rejected. This route has two independent limits: the `auth` tier keyed by IP and the `verify-otp` tier keyed by normalized email."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
      responses:
        "200":
          description: Authentication successful.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refresh access token
      description: Rotates the refresh token and issues a new access token pair. Reuse of a revoked refresh token triggers revocation of the associated session. Unknown JSON fields are rejected. Rate limited by IP using the `auth` tier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Tokens rotated successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Logout (revoke current session)
      description: >-
        Revokes the current login session identified by the `sid` claim in the
        caller's access token. Only the current session is revoked; other sessions
        remain active. The access token itself remains valid until its TTL expires
        (stateless JWT design). Returns 204 even if the session was already revoked
        (idempotent). Rate limited by user ID using the `general-api` tier.
      security:
        - UserJWT: []
      responses:
        "204":
          description: Current session revoked (or already revoked).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

