services:
  api:
    volumes:
      - photodata:/var/lib/pauza/photos
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - photodata:/var/lib/pauza/photos:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  photodata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
