services:
  api:
    build: .
    env_file:
      - ./.env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: postgres:16-alpine
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
