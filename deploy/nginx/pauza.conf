# Host-level Nginx config for Pauza.
# Replace the placeholder values below before installing this on the backend.
#
# Placeholder values to change:
# - api.example.com
# - /srv/pauza/photos
# - /var/www/certbot
# - 127.0.0.1:8080
# - /var/log/nginx/pauza.*.log
# - /etc/letsencrypt/live/api.example.com/fullchain.pem
# - /etc/letsencrypt/live/api.example.com/privkey.pem

upstream pauza_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    access_log /var/log/nginx/pauza.access.log;
    error_log /var/log/nginx/pauza.error.log warn;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /photos/ {
        alias /srv/pauza/photos/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://pauza_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
    }
}
