services:
  api:
    image: ghcr.io/pauzaa/pauza-server:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - "traefik.http.routers.api.rule=Host(`${PUBLIC_DOMAIN}`)"

  traefik:
    image: traefik:v3.3
    pull_policy: always
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-certs:/traefik-certs
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: postgres:16-alpine
    pull_policy: always
    env_file:
      - ./.env.prod
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    pull_policy: always
    env_file:
      - ./.env.prod
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass $REDIS_PASSWORD"]
    volumes:
      - redisdata-prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  traefik-certs:
  pgdata-prod:
  redisdata-prod:
